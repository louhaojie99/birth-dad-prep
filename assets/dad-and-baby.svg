  <title id="title">留着蓬松纹理短发的爸爸温柔地抱着宝宝</title>
  <desc id="desc">留着蓬松纹理短发的爸爸穿着鼠尾草绿开衫，双手托着戴橘色小帽的宝宝，旁边是待产包和绿植。</desc>
